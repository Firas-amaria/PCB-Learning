<!doctype html><meta charset="utf-8"><body><script>
const params = new URLSearchParams(location.search);
if (params.has('preview')) {
  localStorage.setItem('embedded-hub-v1', JSON.stringify({lang: params.get('preview')}));
  location.replace('../index.html#' + (params.get('route') || 'git'));
} else {
  localStorage.setItem('embedded-hub-v1', '{}');
  const frame = document.createElement('iframe');
  frame.style.cssText = 'width:100%;height:900px';
  frame.src = '../index.html'; document.body.append(frame);
  frame.onload = async () => {
    const w = frame.contentWindow, d = w.document;
    const errors = [], results = [];
    w.addEventListener('error', e => errors.push(e.message));
    const assert = (ok, label) => { if (!ok) errors.push(label); };
    const wait = ms => new Promise(resolve => setTimeout(resolve, ms));
    const select = lang => { d.getElementById('language').value = lang; d.getElementById('language').dispatchEvent(new Event('change')); };
    const visit = async route => { w.location.hash = route; await wait(30); };
    try {
      for (const lang of ['ar', 'he', 'en']) {
        select(lang);
        assert(d.documentElement.lang === lang, 'lang ' + lang);
        assert(d.documentElement.dir === (lang === 'en' ? 'ltr' : 'rtl'), 'direction ' + lang);
        for (const route of ['home', 'git', 'basics', 'esp32', 'network', 'http', 'websockets', 'gpio', 'projects', 'projects/hotel', 'projects/queue', 'projects/voting']) {
          await visit(route);
          const main = d.getElementById('main');
          assert(main.querySelector('h1'), 'heading ' + lang + '/' + route);
          if (lang === 'he') {
            assert(/[א-ת]/.test(main.textContent), 'Hebrew content ' + route);
            const proseOnly = main.cloneNode(true);
            proseOnly.querySelectorAll('pre, code').forEach(node => node.remove());
            assert(!/[\u0600-\u06ff]/.test(proseOnly.textContent), 'Arabic leakage ' + route);
          }
          assert(d.documentElement.scrollWidth <= d.documentElement.clientWidth + 1, 'overflow ' + lang + '/' + route);
          results.push(lang + '/' + route);
        }
      }
      await visit('projects/hotel'); select('he');
      assert(w.location.hash === '#projects/hotel', 'language preserves project');
      assert(JSON.parse(localStorage.getItem('embedded-hub-v1')).lang === 'he', 'language saved');
      const checkbox = d.querySelector('[data-project-check]'); checkbox.checked = true; checkbox.dispatchEvent(new Event('change', {bubbles: true}));
      select('en'); assert(d.querySelector('[data-project-check]').checked, 'project check preserved');
      select('he'); const search = d.getElementById('search'); search.value = 'מאגר'; search.dispatchEvent(new Event('input'));
      assert(d.getElementById('results').textContent.includes('Git'), 'Hebrew search');
      search.value = 'Repository'; search.dispatchEvent(new Event('input'));
      assert(d.getElementById('results').textContent.includes('Git'), 'English term search');
      await visit('git');
      assert([...d.querySelectorAll('.technical-term')].some(x=> x.textContent === '(Repository)' && x.dir === 'ltr' && getComputedStyle(x).whiteSpace === 'nowrap'), 'whole gloss isolation');
      assert(d.querySelector('pre').textContent.startsWith('git clone'), 'code unchanged');
      assert(getComputedStyle(d.querySelector('pre')).direction === 'ltr', 'code direction');
      await visit('gpio');
      d.getElementById('raw').value = 1800; d.getElementById('raw').dispatchEvent(new Event('input', {bubbles: true}));
      assert(d.getElementById('decision').textContent.includes('כבוי'), 'Hebrew sensor equality');
      await visit('websockets'); d.getElementById('connect').click(); await wait(550);
      assert(d.getElementById('ws-status').textContent === 'מחובר', 'Hebrew connected state');
      d.getElementById('send').click(); await wait(1800);
      assert(d.getElementById('ws-log').textContent.includes('הדפדפן'), 'Hebrew simulation message');
      await visit('projects/missing'); assert(d.querySelector('h1').textContent === 'הפרויקט לא נמצא', 'unknown project Hebrew');
      await visit('missing'); assert(d.querySelector('h1').textContent === 'הנושא לא נמצא', 'unknown subject Hebrew');
    } catch (e) { errors.push(e.stack); }
    document.body.innerHTML = '<pre id="qa-report"></pre>';
    document.getElementById('qa-report').textContent = JSON.stringify({routes: results.length, errors}, null, 2);
    document.title = errors.length ? 'QA FAILED' : 'QA PASSED';
  };
}
</script>
